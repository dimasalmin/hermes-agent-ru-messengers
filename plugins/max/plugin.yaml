name: max-platform
label: MAX
kind: platform
version: 0.2.0
description: >
  External Hermes Agent adapter for MAX Bot API v2. Uses the documented
  platform-api2.max.ru REST API, HTTPS Webhook or development Long Polling,
  strict allowlist policy, and TLS verification.
  Русский: внешний адаптер Hermes Agent для MAX Bot API v2 с HTTPS Webhook,
  Long Polling для разработки, allowlist-политикой и проверкой TLS.
author: Hermes Agent RU Messenger contributors
license: MIT
homepage: https://github.com/dimasalmin/hermes-agent-ru-messengers

requires_env:
  - name: MAX_BOT_TOKEN
    description: "Bot token created in MAX for Business"
    prompt: "MAX Bot API token"
    password: true
    category: messaging
    url: "https://business.max.ru/"

optional_env:
  - name: MAX_ALLOWED_USERS
    description: "Comma-separated MAX user IDs allowed to use the bot"
    prompt: "Allowed MAX users"
    password: false
    category: messaging
  - name: MAX_GROUP_ALLOWED_USERS
    description: "Comma-separated user IDs allowed in groups"
    prompt: "Allowed MAX group users"
    password: false
    category: messaging
  - name: MAX_GROUP_ALLOWED_CHATS
    description: "Comma-separated group chat IDs allowed for the bot"
    prompt: "Allowed MAX group chats"
    password: false
    category: messaging
  - name: MAX_ALLOW_ALL_USERS
    description: "Development-only override that disables the allowlist"
    prompt: "Allow all MAX users?"
    password: false
    category: messaging
  - name: MAX_WEBHOOK_URL
    description: "HTTPS Webhook URL on the required public port 443"
    prompt: "MAX Webhook URL"
    password: false
    category: messaging
  - name: MAX_WEBHOOK_SECRET
    description: "Secret sent in X-Max-Bot-Api-Secret"
    prompt: "MAX Webhook secret"
    password: true
    category: messaging
  - name: MAX_CA_BUNDLE
    description: "Optional PEM bundle containing the MAX trusted chain"
    prompt: "MAX CA bundle path"
    password: false
    category: messaging
  - name: MAX_API_BASE_URL
    description: "Advanced override; defaults to https://platform-api2.max.ru"
    prompt: "MAX API base URL"
    password: false
    category: messaging
  - name: MAX_INBOX_PATH
    description: "Shared SQLite inbox path used by Hermes and the optional Webhook ingress"
    prompt: "MAX Webhook inbox path"
    password: false
    category: messaging
  - name: MAX_MARKER_PATH
    description: "SQLite path for the Long Polling marker"
    prompt: "MAX polling marker path"
    password: false
    category: messaging
  - name: MAX_TARGET_PATH
    description: "SQLite path for persisted MAX user/chat target types"
    prompt: "MAX target state path"
    password: false
    category: messaging
  - name: MAX_CALLBACK_TTL_SECONDS
    description: "Lifetime of native MAX button callbacks in seconds"
    prompt: "MAX button callback TTL"
    password: false
    category: messaging
  - name: MAX_MEDIA_MAX_BYTES
    description: "Maximum size of one inbound or outbound media attachment"
    prompt: "MAX media size limit in bytes"
    password: false
    category: messaging
